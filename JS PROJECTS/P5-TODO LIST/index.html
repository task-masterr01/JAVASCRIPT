<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link
         href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
            rel="stylesheet"
         />
</head>
<body>
   <div class="container">
    <div class="header">
        <div class="search-bar">
            <i class="ri-search-line"></i>
            <input type="text " placeholder="search for any task">
        </div>
        <div class="header-icons">
            <button class="icon-btn">
                <i class="ri-notification-line"></i>
                <span class="notification-dot"></span>
            </button>
            <button class="icon-btn">
                <i class="ri-user-3-fill"></i>
            </button>
        </div>
    </div>
    <div class="main-content">
        <div class="title-section">
            <div class="greeting" id="greeting"></div>
            <h1>
                you've got <span class="task-count" id="task-count">0</span> task today
                <button class="add-btn" onclick="openmodal()">
                    <i class="ri-add-line"></i> Add new 

                </button>
            </h1>
        </div>
    </div>
    <div class="section">
        <div class="section-header"> <h2>on hold</h2> </div>
            
            <div id="onHoldTasks">
                <div class="task-item">
                    <div class="task-checkbox " onclick="toggleTask()"></div>
                    <div class="task-content">
                        <div class="task-title " >Cooking something</div>
                    </div>
                    <span class="status-badge status-pending"></span>
                    <div class="priority-badge priority-something">
                        <i class="ri-checkbox-blank-circle-fill"></i>
                    </div>
                    <div class="avatar">CF</div>
                    <button class="icon-btn" style="width: 30px; height: 30px;" onclick="editTask()">
                        <i class="ri-pencil-fill" style="font-size: 12px;"></i>
                    </button>
                    <button class="icon-btn" style="width: 30px; height: 30px;" onclick="deleteTask()">
                        <i class="ri-delete-bin-fill" style="font-size: 12px;"></i>
                    </button>
                </div>
            </div>
        
    </div>
    <div class="section">
        <div class="section-header">
            <h2>completed</h2>
            <div id="completedTasks"></div>
            
        </div>
    </div>
    <div class="section">
        <div class="section-header">
            <h2>incompleted</h2>
            <span class="badge badgeInactive">Inactive</span>
            <div id="incompleteTasks"></div>
        </div>
    </div>
   </div> 
   
</body>
<script src="script.js"></script> 
</html>
