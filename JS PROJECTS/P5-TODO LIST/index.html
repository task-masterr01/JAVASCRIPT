<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link
         href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
            rel="stylesheet"
         />
</head>
<body>
   <div class="container">
    <div class="header">
        <div class="search-bar">
            <i class="ri-search-line"></i>
            <input type="text " placeholder="search for any task">
        </div>
        <div class="header-icons">
            <button class="icon-btn">
                <i class="ri-notification-line"></i>
                <span class="notification-dot"></span>
            </button>
            <button class="icon-btn">
                <i class="ri-user-3-fill"></i>
            </button>
        </div>
    </div>
    <div class="main-content">
        <div class="title-section">
            <div class="greeting" id="greeting"></div>
            <h1>
                you've got <span class="task-count" id="task-count">0</span> task today
                <button class="add-btn" onclick="openmodal()">
                    <i class="ri-add-line"></i> Add new 

                </button>
            </h1>
        </div>
    
    <div class="section">
        <div class="section-header"> <h2>on hold</h2> </div>
            
            <div id="onHoldTasks">
                
            </div>
        
    </div>
    <div class="section">
        <div class="section-header">
            <h2>completed</h2>
            <div id="completedTasks"></div>
            
        </div>
    </div>
    <div class="section">
        <div class="section-header">
            <h2>incompleted</h2>
            <span class="badge badgeInactive">Inactive</span>
            <div id="incompleteTasks"></div>
        </div>
    </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Results summary</div>
            <div class="stat-card">
                <div class="stat-label">completion rate</div>
                <div class="stat-value" id="completionRateValue">0%</div>
                <div class="progress-bar">
                    <div
                     class="progress-fill" 
                     id="completionProgress" 
                     style="width: 0%;"
                     ></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total tasks</div>
                <div class="stat-value" id="totalTasks">0</div>
                <div class="progress-bar">
                    <div
                     class="progress-fill" 
                     id="totalProgress" 
                     style="width: 0%;"
                     ></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">completed</div>
                <div class="stat-value" id="completedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">pending</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
   </div>
   <div class="modal" id="taskModal">
    <div class="modal-content">
        <h2 class="modal-header"> Add / Update Task</h2>
        <form id="taskForm" autocomplete="off">
            <div class="form-group">
                <label > Task Title </label>
            <input 
            type="text"
             id="taskTitle" 
             placeholder="Enter Task Title" 
             required
             />
            </div>
            <div class="form-group">
                <label >Status</label>
                <select  id="taskStatus">
                    <option value="Pending">Pending</option>
                    <option value="progress">In Progress</option>
                    <option value="completed">completed</option>
                </select>
            </div>
            <div class="form-group">
                <label >priority</label>
                <select  id="taskPriority">
                    <option value="minor">minor</option>
                    <option value="normal">Normal</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
            <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">
                Cancel 
            </button>
            <button type="submit" class="btn btn-primary" >Save task</button>
            </div>
            </form>
    </div>
   </div> 
   
</body>
<script src="script.js"></script> 
</html>
