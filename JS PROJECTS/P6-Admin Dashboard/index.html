<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css">
    <link rel="stylesheet" href="style.css">
    <title> Responsive Admin DashBoard</title>
</head>
<body>
    <div class="container">
        <aside>
            <div class="top">
                <div class="logo">
                    <img src="dpdp.png" alt="">
                    <h2 >REAY  <span class="primary">TECH</span></h2>
                </div>
                <div class="close" id="close-btn">
                    <i class="ri-close-large-line"></i>
                </div>
            </div>
            <div class="sidebar">
                <a href="#">
                    <i class="ri-dashboard-line"></i>
                    <h3>Dashboard</h3>
                </a>
                <a href="#" class="active">
                    <i class="ri-user-fill"></i>
                    <h3>Customers</h3>
                </a>
                <a href="#">
                    <i class="ri-receipt-fill"></i>
                    <h3>Orders</h3>
                </a>
                <a href="#">
                    <i class="ri-line-chart-line"></i>
                    <h3>Analytics</h3>
                </a>
                <a href="#">
                    <i class="ri-mail-fill"></i>
                    <h3>Messages</h3>
                    <span class="message-count">26</span>
                </a>
                <a href="#">
                    <i class="ri-list-view"></i>
                    <h3>Products</h3>
                </a>
                <a href="#">
                    <i class="ri-file-chart-line"></i>
                    <h3>Reports</h3>
                </a>
                <a href="#">
                    <i class="ri-settings-5-fill"></i>
                    <h3>Settings</h3>
                </a>
                <a href="#">
                    <i class="ri-add-large-line"></i>
                    <h3>Add Product</h3>
                </a>
                <a href="#">
                    <i class="ri-logout-box-r-line"></i>
                    <h3>Logout</h3>
                </a>
            </div>
        </aside>

        <!--=====================END OF ASIDE ================== -->

        <main>
            <h1>Dashboard</h1>
            <div class="date">
                <input type="date">
            </div>
            <div class="insights">
                 <div class="sales">
                    
                 </div>
            </div>
        </main>
    </div>
</body>
</html>
